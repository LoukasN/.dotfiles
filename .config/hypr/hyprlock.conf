general {
    ignore_empty_input = true
}

auth {
	pam:enabled = true
	pam:module = hyprlock
	fingerprint:enabled = true
}

background {
    monitor =
    path = screenshot
    color = rgba(0, 0, 0, 1.0)
	blur_passes = 4
    blur_size = 8
    noise = 0.0117
    contrast = 1.0
    brightness = 0.8
    vibrancy = 1.0
    vibrancy_darkness = 0.0
}

input-field {
    size = 200, 50
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = false
    dots_rounding = -1
    outer_color = rgb(0, 0, 0)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(0, 0, 0)
    fade_on_empty = true
    fade_timeout = 5000
    placeholder_text = <i>Enter Password</i>
    hide_input = false
    rounding = -1

    position = 0, -20
    halign = center
    valign = center
}

label {
    text = [ (ʘ‿ʘ)╯ | $TIME]
    color = rgba(200, 200, 200, 1.0)
    font_size = 30
    font_family = MartianMonoNF

    position = 0, 80
    halign = center
    valign = center
}

label {
    text = $LAYOUT
    color = rgba(200, 200, 200, 1.0)
    font_size = 12
    font_family = MartianMonoNF

    position = 0, -90
    halign = center
    valign = center
}

label {

    text = $FPRINTPROMPT
    color = rgba(200, 200, 200, 1.0)
    font_size = 12
    font_family = MartianMonoNF

    position = 0, -120
    halign = center
    valign = center
}
