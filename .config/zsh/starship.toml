"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = "$directory$git_branch$git_status$character"

[directory]
format = "[$path](cyan)[$read_only]($read_only_style) "
read_only = " X"
truncation_length = 3
truncate_to_repo  = true

[git_branch]
format = "[$branch](bold blue) "

[git_status]
format     = "($ahead_behind$staged$modified$untracked$deleted$conflicted)"
ahead      = "[⇡$count ](bold green)"
behind     = "[⇣$count ](bold green)"
diverged   = "[⇡$ahead_count⇣$behind_count ](bold cyan)"
staged     = "[+$count ](bold blue)"
modified   = "[!$count ](bold green)"
untracked  = "[?$count ](bold yellow)"
deleted    = "[-$count ](bold red)"
conflicted = "[~$count ](bold red)"

[character]
success_symbol = "[❯](green)"
error_symbol   = "[❯](red)"
vimcmd_symbol  = "[❮](blue)"
